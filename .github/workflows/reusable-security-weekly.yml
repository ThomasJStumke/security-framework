name: Reusable Security Daily Scan
# Filename kept as reusable-security-weekly.yml to avoid rewriting every consuming
# repo's `uses:` reference; the cadence is daily as of 2026-08-16 (per-repo cron in
# each repo's own .github/workflows/security-weekly.yml wrapper -- this reusable
# workflow itself has no schedule trigger of its own, only workflow_call).

on:
  workflow_call:
    inputs:
      application-id:
        required: true
        type: string
      supabase-enabled:
        required: false
        type: boolean
        default: false
      node-version:
        required: false
        type: string
        default: "20"
      scan-url:
        description: "Staging/preview URL for OWASP ZAP baseline / Nuclei / Nmap. Empty = all three are skipped (source-code scans still run)."
        required: false
        type: string
        default: ""
      enable-nuclei:
        required: false
        type: boolean
        default: true
      enable-nmap:
        description: "Most apps in this fleet are serverless behind Cloudflare/Vercel, where a port scan only reveals the edge, not the app — default false. Opt in per-repo only for confirmed non-serverless/self-hosted infrastructure (e.g. a homelab box behind a Cloudflare Tunnel with its own exposed origin)."
        required: false
        type: boolean
        default: false
      mc-security-url:
        required: false
        type: string
        default: ""
      runner-labels:
        description: "JSON array (as string) of runner labels, e.g. '[\"self-hosted\",\"homelab\"]'. Defaults to GitHub-hosted so repos without a homelab runner registered yet are unaffected."
        required: false
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      MISSION_CONTROL_SECURITY_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: security-weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-previous-scan:
    name: Check previous scan (skip unchanged source scans)
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 3
    outputs:
      code-unchanged: ${{ steps.check.outputs.code-unchanged }}
    steps:
      - id: check
        env:
          MC_SECURITY_URL: ${{ inputs.mc-security-url }}
          MC_APPLICATION_ID: ${{ inputs.application-id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set +e
          # Conservative by design: any failure/ambiguity here (MC unreachable, no
          # prior scan, unexpected response shape) falls through to "false" (run
          # everything) -- this check only ever SKIPS work, never security coverage,
          # so the safe failure mode is "scan anyway", not "skip and hope".
          echo "code-unchanged=false" >> "$GITHUB_OUTPUT"
          if [ -z "$MC_SECURITY_URL" ]; then
            echo "MC_SECURITY_URL not set — cannot check previous scan, running everything."
            exit 0
          fi
          BASE_URL="${MC_SECURITY_URL%/api/security/scans}"
          RESP=$(curl -sf --max-time 15 "${BASE_URL}/api/security/scans?applicationId=${MC_APPLICATION_ID}&limit=5")
          [ -z "$RESP" ] && exit 0
          LAST_SHA=$(node -e '
            try {
              const d = JSON.parse(process.argv[1] || "{}");
              const items = d.items || [];
              const last = items.find((i) => i.scanType === "daily" && i.status === "completed");
              process.stdout.write(last && last.commitSha ? last.commitSha : "");
            } catch { process.stdout.write(""); }
          ' "$RESP")
          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" = "$COMMIT_SHA" ]; then
            echo "Previous successful daily scan already covered commit $COMMIT_SHA — skipping source/dependency re-scan."
            echo "code-unchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "No unchanged prior scan found for $COMMIT_SHA (last scanned: ${LAST_SHA:-none}) — running full suite."
          fi

  gitleaks-history:
    name: Gitleaks (full git history)
    needs: [check-previous-scan]
    if: ${{ needs.check-previous-scan.outputs.code-unchanged != 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks against full history
        run: |
          mkdir -p .security-reports
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect \
            --source=/repo --report-format=json --report-path=/repo/.security-reports/gitleaks.json --exit-code=0 || true
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-gitleaks
          path: .security-reports/gitleaks.json
          retention-days: 90

  semgrep:
    name: Semgrep CE (full SAST)
    needs: [check-previous-scan]
    if: ${{ needs.check-previous-scan.outputs.code-unchanged != 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 20
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.78.0
      # Self-hosted runners reuse the same on-disk workspace across jobs in a run
      # (unlike ubuntu-latest's fresh VM per job) -- a container running as root
      # (the image default) leaves root-owned files that break the next job's
      # checkout cleanup with EACCES. Run as the homelab runner's own uid when
      # self-hosted; harmless no-op string on ubuntu-latest since it never opts in.
      options: ${{ contains(inputs.runner-labels, 'self-hosted') && '--user 1000:1000' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          mkdir -p .security-reports
          semgrep scan \
            --config p/security-audit --config p/secrets --config p/owasp-top-ten \
            --config p/typescript --config p/react \
            --json --output=.security-reports/semgrep.json --error || true
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-semgrep
          path: .security-reports/semgrep.json
          retention-days: 90

  trivy:
    name: Trivy (dependencies/config/IaC/Docker)
    needs: [check-previous-scan]
    if: ${{ needs.check-previous-scan.outputs.code-unchanged != 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: mkdir -p .security-reports
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: "vuln,secret,misconfig"
          format: json
          output: .security-reports/trivy.json
          severity: "CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN"
          exit-code: "0"
      - name: Trivy Docker image scan (only if this repo builds a Dockerfile)
        if: ${{ hashFiles('Dockerfile', '**/Dockerfile') != '' }}
        run: |
          DOCKERFILE=$(find . -maxdepth 3 -iname 'Dockerfile' | head -1)
          docker build -t security-scan-target:local -f "$DOCKERFILE" . || { echo "Docker build failed — skipping image scan, filesystem scan above still covers Dockerfile misconfig." > .security-reports/trivy-image.skipped; exit 0; }
          docker run --rm -v "$PWD/.security-reports:/out" -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --format json --output /out/trivy-image.json --severity CRITICAL,HIGH,MEDIUM,LOW --exit-code 0 security-scan-target:local || true
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-trivy
          path: |
            .security-reports/trivy.json
            .security-reports/trivy-image.json
          retention-days: 90
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit
    needs: [check-previous-scan]
    if: ${{ needs.check-previous-scan.outputs.code-unchanged != 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Detect package manager and run appropriate audit
        run: |
          set +e
          mkdir -p .security-reports
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            # The actual package manager for nearly every consuming repo --
            # checked first since several of them also carry a stray
            # package-lock.json alongside bun.lock, which would otherwise
            # false-match the npm fallback below and audit a lockfile that
            # was never the one actually resolved/installed from.
            echo "bun" > .security-reports/dependency-audit.manager
            if ! command -v bun >/dev/null 2>&1; then
              curl -fsSL https://bun.sh/install | bash
              export PATH="$HOME/.bun/bin:$PATH"
            fi
            bun audit --json > .security-reports/dependency-audit.json 2>/dev/null
          elif [ -f pnpm-lock.yaml ]; then
            echo "pnpm" > .security-reports/dependency-audit.manager
            corepack enable
            corepack prepare pnpm@latest --activate
            pnpm audit --json > .security-reports/dependency-audit.json 2>/dev/null
          elif [ -f yarn.lock ]; then
            echo "yarn" > .security-reports/dependency-audit.manager
            corepack enable
            yarn audit --json > .security-reports/dependency-audit.json 2>/dev/null
          elif [ -f requirements.txt ] || [ -f pyproject.toml ] || [ -f Pipfile ]; then
            echo "pip-audit" > .security-reports/dependency-audit.manager
            pip install --quiet pip-audit
            if [ -f requirements.txt ]; then
              pip-audit -r requirements.txt -f json -o .security-reports/dependency-audit.json
            else
              pip-audit -f json -o .security-reports/dependency-audit.json
            fi
          else
            echo "npm" > .security-reports/dependency-audit.manager
            npm install --package-lock-only --ignore-scripts
            npm audit --json --package-lock-only > .security-reports/dependency-audit.json
          fi
          [ -s .security-reports/dependency-audit.json ] || echo '{}' > .security-reports/dependency-audit.json
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-dependency-audit
          path: |
            .security-reports/dependency-audit.json
            .security-reports/dependency-audit.manager
          retention-days: 90

  supabase-check:
    name: Supabase/RLS static check
    needs: [check-previous-scan]
    if: ${{ inputs.supabase-enabled && needs.check-previous-scan.outputs.code-unchanged != 'true' }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ThomasJStumke/security-framework
          path: .security-framework
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: node .security-framework/scripts/supabase-check.mjs . .security-reports/supabase-check.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-supabase
          path: .security-reports/supabase-check.json
          retention-days: 90

  zap-baseline:
    name: OWASP ZAP baseline
    if: ${{ inputs.scan-url != '' }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: ZAP Baseline Scan (passive only — no active/attack rules)
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.scan-url }}
          cmd_options: "-a -j"
          fail_action: false
          # This action defaults to filing a GitHub issue with the report whenever
          # any alert is present. The job only has `contents: read`, so that POST
          # always 403'd and failed the whole job even though the scan itself
          # succeeded (WARN-level passive findings are expected/normal). Findings
          # already reach Mission Control via normalize-and-submit below, so the
          # GitHub-issue path is redundant — disable it rather than widening
          # permissions to `issues: write` just to let it succeed.
          allow_issue_writing: false
          artifact_name: security-zap
      - run: |
          mkdir -p .security-reports
          [ -f report_json.json ] && cp report_json.json .security-reports/zap-baseline.json || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-zap-normalized
          path: .security-reports/zap-baseline.json
          retention-days: 90
          if-no-files-found: ignore

  nuclei:
    name: Nuclei (safe, non-destructive templates)
    if: ${{ inputs.scan-url != '' && inputs.enable-nuclei }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Nuclei against confirmed app URL only
        run: |
          mkdir -p .security-reports
          # Vetted, explicitly non-destructive template tags only:
          #   exposed-panels, exposures, misconfiguration, headers/security-headers, ssl,
          #   technologies (fingerprinting) and default-logins-detection *without* credential
          #   submission (Nuclei's default-login templates are read-only checks against known
          #   default-creds banners; they don't POST attempted logins).
          # Explicitly excluded: dast, fuzz, intrusive, takeover (some are destructive-adjacent),
          #   and anything tagged "dos".
          docker run --rm -v "$PWD/.security-reports:/out" projectdiscovery/nuclei:v3.11.1 \
            -u "${{ inputs.scan-url }}" \
            -tags exposed-panels,exposure,misconfig,headers,ssl,tech \
            -etags dos,fuzz,intrusive,takeover \
            -severity info,low,medium,high,critical \
            -rl 20 -c 10 \
            -jsonl -o /out/nuclei.jsonl \
            -no-interactsh \
            -silent || true
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-nuclei
          path: .security-reports/nuclei.jsonl
          retention-days: 90
          if-no-files-found: ignore

  nuclei-not-configured:
    name: Nuclei (skipped — no scan-url)
    if: ${{ inputs.scan-url == '' || !inputs.enable-nuclei }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    steps:
      - run: echo "Nuclei skipped — no SECURITY_SCAN_URL configured for this repo, or enable-nuclei is false. Source-code/dependency scans above are unaffected."

  nmap:
    name: Nmap (conservative exposure check)
    if: ${{ inputs.scan-url != '' && inputs.enable-nmap }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Conservative top-ports discovery scan (no NSE scripts, no exploits, no brute force)
        run: |
          set -e
          HOST=$(node -e "console.log(new URL(process.env.SCAN_URL).hostname)")
          echo "Target host: $HOST (derived from configured SECURITY_SCAN_URL — never guessed)"
          sudo apt-get update -qq && sudo apt-get install -y -qq nmap
          mkdir -p .security-reports
          # -Pn: skip host discovery (many app hosts block ICMP). --top-ports 100: common ports
          # only. -T3: default polite timing. No -sV banner grab beyond default, no --script,
          # no -A, no brute-force/vuln NSE categories. Read-only TCP connect/SYN probing only.
          nmap -Pn --top-ports 100 -T3 -oX .security-reports/nmap.xml "$HOST" || true
        env:
          SCAN_URL: ${{ inputs.scan-url }}
        continue-on-error: true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-nmap
          path: .security-reports/nmap.xml
          retention-days: 90
          if-no-files-found: ignore

  nmap-not-applicable:
    name: Nmap (not applicable — no scan-url / serverless target)
    if: ${{ inputs.scan-url == '' || !inputs.enable-nmap }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    steps:
      - run: |
          echo 'Nmap N/A -- no SECURITY_SCAN_URL configured, or enable-nmap is false (the default). Most apps here are serverless behind Cloudflare/Vercel, where a port scan only reveals the edge network, not the app, so this is off by default. Set enable-nmap: true per-repo only for confirmed non-serverless/self-hosted infrastructure.'

  normalize-and-submit:
    name: Normalize + submit to Mission Control
    needs: [check-previous-scan, gitleaks-history, semgrep, trivy, dependency-audit, supabase-check, zap-baseline, nuclei, nmap]
    if: ${{ always() }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ThomasJStumke/security-framework
          path: .security-framework
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: .security-reports-raw
      - run: |
          mkdir -p .security-reports
          find .security-reports-raw -type f \( -name "*.json" -o -name "*.jsonl" -o -name "*.xml" -o -name "*.manager" \) -exec cp {} .security-reports/ \;
          ls -la .security-reports
      - env:
          REPORTS_DIR: .security-reports
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          MC_APPLICATION_ID: ${{ inputs.application-id }}
          MC_SECURITY_URL: ${{ inputs.mc-security-url }}
          MISSION_CONTROL_SECURITY_TOKEN: ${{ secrets.MISSION_CONTROL_SECURITY_TOKEN }}
          SCAN_TYPE: daily
          SCAN_ENVIRONMENT: ${{ inputs.scan-url != '' && 'staging' || 'ci' }}
          SCAN_URL: ${{ inputs.scan-url }}
          SUPABASE_ENABLED: ${{ inputs.supabase-enabled }}
          ENABLE_NUCLEI: ${{ inputs.enable-nuclei }}
          ENABLE_NMAP: ${{ inputs.enable-nmap }}
          CODE_UNCHANGED: ${{ needs.check-previous-scan.outputs.code-unchanged }}
          SCAN_STARTED_AT: ${{ github.event.repository.updated_at }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node .security-framework/scripts/normalize-and-submit.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-normalized-summary
          path: .security-reports/normalized-payload.json
          retention-days: 90
