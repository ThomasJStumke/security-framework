name: Reusable Performance Daily

# Called by each consuming repo's .github/workflows/performance-daily.yml wrapper
# (which owns the schedule). Runs Lighthouse CI, size-limit, Knip and an optional
# Playwright synthetic journey, builds a static code inventory, and submits both
# to Mission Control (POST /api/performance/runs + /api/analytics/inventory) using
# the same MISSION_CONTROL_SECURITY_TOKEN already provisioned for security-scan
# ingestion — no new secret.

on:
  workflow_call:
    inputs:
      application-id:
        required: true
        type: string
      target-url:
        description: "Deployed URL for Lighthouse to audit. Empty = Lighthouse is skipped, the rest still run."
        required: false
        type: string
        default: ""
      lighthouse-runs:
        required: false
        type: number
        default: 3
      node-version:
        required: false
        type: string
        default: "20"
      run-playwright:
        description: "Run tests/perf.spec.ts (a scripted critical-path walk) if present."
        required: false
        type: boolean
        default: true
      mc-performance-url:
        required: false
        type: string
        default: ""
      runner-labels:
        required: false
        type: string
        default: '["ubuntu-latest"]'
    secrets:
      MISSION_CONTROL_SECURITY_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: performance-daily-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance:
    name: Collect + submit performance signals
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ThomasJStumke/security-framework
          path: .perf-framework

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          mkdir -p .perf-reports
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable && corepack prepare pnpm@latest --activate && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable && yarn install --frozen-lockfile
          else
            npm ci
          fi
        continue-on-error: true

      - name: Build
        run: |
          if grep -q '"build"' package.json; then
            (bun run build || npm run build) || echo "build failed — Lighthouse against target-url still runs; size-limit may be degraded."
          fi
        continue-on-error: true

      # Lighthouse needs a Chrome binary. Self-hosted runners usually have none (every run was reported
      # "partial" with "CHROME_PATH environment variable must be set"), so fall back to Playwright's
      # Chromium, installed per-user (no sudo) and reused from the browser cache on later runs.
      - name: Locate Chrome for Lighthouse
        if: ${{ inputs.target-url != '' }}
        run: |
          if [ -z "$CHROME_PATH" ] && ! command -v google-chrome >/dev/null 2>&1 \
             && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            CACHE="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
            find_chrome() { ls -d "$CACHE"/chromium-*/chrome-linux*/chrome 2>/dev/null | sort -V | tail -1; }
            CHROME="$(find_chrome)"
            if [ -z "$CHROME" ]; then
              npx --yes playwright install chromium || true
              CHROME="$(find_chrome)"
            fi
            if [ -n "$CHROME" ]; then
              echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
              echo "Using Chromium at $CHROME"
            else
              echo "No Chrome available -- Lighthouse will be reported as partial."
            fi
          fi
        continue-on-error: true

      - name: Lighthouse CI
        if: ${{ inputs.target-url != '' }}
        run: |
          npx --yes @lhci/cli@0.13.x collect \
            --url="${{ inputs.target-url }}" \
            --numberOfRuns=${{ inputs.lighthouse-runs }} \
            --settings.chromeFlags="--no-sandbox --headless=new" || echo "Lighthouse collect failed — reported as partial."
        continue-on-error: true

      - name: size-limit
        run: |
          if [ -f .size-limit.json ] || [ -f .size-limit.js ] || grep -q '"size-limit"' package.json 2>/dev/null; then
            # keep the previous run's numbers for the delta
            if [ -n "${{ inputs.mc-performance-url }}" ] && [ -n "${{ secrets.MISSION_CONTROL_SECURITY_TOKEN }}" ]; then
              BASE="${{ inputs.mc-performance-url }}"; BASE="${BASE%/api/performance/runs}"
              curl -sf --max-time 15 "${BASE}/api/performance/runs?applicationId=${{ inputs.application-id }}&latestOnly=true" \
                -H "Authorization: Bearer ${{ secrets.MISSION_CONTROL_SECURITY_TOKEN }}" \
                | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const j=JSON.parse(d);const b=(j.data?.items?.[0]??j.items?.[0]);if(b?.bundleBytesGzip)process.stdout.write(JSON.stringify([{size:b.bundleBytesGzip}]))}catch{}})' \
                > .perf-reports/size-limit.prev.json || true
            fi
            if [ -f .size-limit.js ] || grep -q '"size-limit"' package.json 2>/dev/null; then
              npx --yes size-limit --json > .perf-reports/size-limit.json 2>/dev/null || echo "[]" > .perf-reports/size-limit.json
            else
              # .size-limit.json only: size-limit isn't installed in this repo, so measure it ourselves.
              node .perf-framework/scripts/measure-bundle.mjs > .perf-reports/size-limit.json 2>/dev/null || echo "[]" > .perf-reports/size-limit.json
            fi
          else
            echo "[]" > .perf-reports/size-limit.json
          fi
        continue-on-error: true

      - name: Knip
        run: |
          npx --yes knip --reporter json --no-exit-code > .perf-reports/knip.json 2>/dev/null || echo "{}" > .perf-reports/knip.json
        continue-on-error: true

      - name: Playwright synthetic journey
        if: ${{ inputs.run-playwright }}
        run: |
          if [ -f tests/perf.spec.ts ] || [ -f e2e/perf.spec.ts ]; then
            npx --yes playwright install --with-deps chromium || true
            npx --yes playwright test tests/perf.spec.ts e2e/perf.spec.ts \
              --reporter=json > .perf-reports/playwright-report.json 2>/dev/null || true
          fi
        continue-on-error: true

      - name: Build code inventory
        env:
          REPO_DIR: ${{ github.workspace }}
          KNIP_JSON: .perf-reports/knip.json
          OUT: .perf-reports/inventory.json
        run: node .perf-framework/scripts/build-inventory.mjs
        continue-on-error: true

      - name: Normalize + submit to Mission Control
        env:
          PERF_REPORTS_DIR: .perf-reports
          MC_PERFORMANCE_URL: ${{ inputs.mc-performance-url }}
          MISSION_CONTROL_SECURITY_TOKEN: ${{ secrets.MISSION_CONTROL_SECURITY_TOKEN }}
          MC_APPLICATION_ID: ${{ inputs.application-id }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          TARGET_URL: ${{ inputs.target-url }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PERF_STARTED_AT: ${{ steps.start.outputs.at }}
        run: node .perf-framework/scripts/perf-normalize-and-submit.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-reports
          path: |
            .perf-reports/
            .lighthouseci/
          retention-days: 30
          if-no-files-found: ignore
