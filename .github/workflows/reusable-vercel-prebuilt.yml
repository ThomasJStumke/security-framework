name: Reusable Vercel Prebuilt Deploy

# Builds an app on the homelab runner and uploads the finished output to Vercel
# ("vercel build" here, then "vercel deploy --prebuilt"), so Vercel spends no
# build minutes on it. Called by each app's .github/workflows/homelab-deploy.yml,
# which Mission Control dispatches when that app's build mode is "homelab"
# (see unity-bridge-core src/lib/homelab-build.server.ts).
#
#   target=staging    -> preview deployment of <sha>, tagged as the `staging`
#                        branch (meta githubCommitRef=staging) and given the
#                        staging alias, so Mission Control reads it exactly like
#                        a Vercel-built staging deployment.
#   target=production -> production deployment of <sha>; Vercel points the
#                        production domains at it as soon as it is ready.
#
# Every deployment carries meta homelabBuildId=<build-id>, which is how Mission
# Control finds the deployment a dispatch produced.
#
# Needs one secret in the calling repo: VERCEL_TOKEN (a Vercel access token
# scoped to the team that owns the project). The org/team id and project id
# are plain inputs, they are not secret.

on:
  workflow_call:
    inputs:
      target:
        description: "staging or production"
        required: true
        type: string
      sha:
        description: "Full 40-character commit SHA to build."
        required: true
        type: string
      branch:
        description: "Branch the commit must be on. Recorded as the deployment's githubCommitRef."
        required: false
        type: string
        default: "staging"
      build-id:
        description: "Mission Control's id for this build (mc_homelab_builds.id). Stored as deployment meta homelabBuildId."
        required: false
        type: string
        default: ""
      vercel-org-id:
        description: "Vercel team id (team_...)."
        required: true
        type: string
      vercel-project-id:
        description: "Vercel project id (prj_...)."
        required: true
        type: string
      staging-alias:
        description: "Hostname to point at a staging build, e.g. <project>-git-staging-<team>.vercel.app. Empty = no alias."
        required: false
        type: string
        default: ""
      node-version:
        description: "Match the Vercel project's Node.js version setting."
        required: false
        type: string
        default: "24"
      vercel-cli-version:
        required: false
        type: string
        default: "65.15.0"
      runner-labels:
        required: false
        type: string
        default: '["self-hosted","homelab"]'
    secrets:
      VERCEL_TOKEN:
        required: true
    outputs:
      deployment-url:
        description: "https:// URL of the new deployment."
        value: ${{ jobs.deploy.outputs.deployment-url }}
      deployment-id:
        description: "Vercel deployment id (dpl_...)."
        value: ${{ jobs.deploy.outputs.deployment-id }}

permissions:
  contents: read

jobs:
  deploy:
    name: Build on homelab, deploy prebuilt to Vercel (${{ inputs.target }})
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    # The homelab job-started hook can wait up to ~55 minutes for the shared
    # build slot, and that wait counts against this limit.
    timeout-minutes: 75
    outputs:
      deployment-url: ${{ steps.deploy.outputs.url }}
      deployment-id: ${{ steps.deploy.outputs.id }}
    env:
      TARGET: ${{ inputs.target }}
      SHA: ${{ inputs.sha }}
      BRANCH: ${{ inputs.branch }}
      BUILD_ID: ${{ inputs.build-id }}
      STAGING_ALIAS: ${{ inputs.staging-alias }}
      VERCEL_ORG_ID: ${{ inputs.vercel-org-id }}
      VERCEL_PROJECT_ID: ${{ inputs.vercel-project-id }}
      VERCEL_CLI: vercel@${{ inputs.vercel-cli-version }}
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check inputs
        env:
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          set -euo pipefail
          case "$TARGET" in staging|production) ;; *) echo "::error::target must be staging or production, got '$TARGET'"; exit 1 ;; esac
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit SHA"; exit 1; }
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::invalid branch name"; exit 1; }
          [[ -z "$BUILD_ID" || "$BUILD_ID" =~ ^[0-9a-fA-F-]{1,64}$ ]] || { echo "::error::invalid build-id"; exit 1; }
          [[ -z "$STAGING_ALIAS" || "$STAGING_ALIAS" =~ ^[a-z0-9.-]+$ ]] || { echo "::error::invalid staging-alias"; exit 1; }
          [[ "$VERCEL_ORG_ID" =~ ^team_[A-Za-z0-9]+$ ]] || { echo "::error::vercel-org-id must be a team id (team_...)"; exit 1; }
          [[ "$VERCEL_PROJECT_ID" =~ ^prj_[A-Za-z0-9]+$ ]] || { echo "::error::vercel-project-id must be a project id (prj_...)"; exit 1; }
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::The VERCEL_TOKEN secret is not set in this repository"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # Full history: the app's own build reads `git log` (build sha/date),
          # and the branch check below needs the branch's history.
          fetch-depth: 0

      - name: Check the commit is on the branch
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          if ! git merge-base --is-ancestor "$SHA" "origin/${BRANCH}"; then
            echo "::error::$SHA is not on origin/${BRANCH}; refusing to deploy it."
            exit 1
          fi
          # A named branch (not a detached HEAD) so the git metadata the Vercel
          # CLI sends with the deployment names the branch.
          git checkout -B "$BRANCH" "$SHA"
          echo "Building $(git log -1 --format='%h %s')"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      # Most fleet apps install with Bun (bun.lock); vercel build picks the
      # package manager from the lockfile, so Bun must be on the runner's PATH.
      - name: Set up Bun (bun.lock projects)
        if: ${{ hashFiles('bun.lock', 'bun.lockb') != '' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Pull Vercel project settings and environment variables
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "production" ]; then
            npx --yes "$VERCEL_CLI" pull --yes --environment=production
          else
            # Preview variables, including any scoped to this branch.
            npx --yes "$VERCEL_CLI" pull --yes --environment=preview --git-branch="$BRANCH"
          fi

      # Browser-side variables are baked into the bundle at build time. Vercel never hands a
      # "Sensitive" variable's value to an outside build, so it would ship blank: on 2026-11-14 a
      # homelab build of DareToFish shipped VITE_SUPABASE_URL empty and every page broke. Refuse
      # to build instead (production is left alone); the app can build on Vercel meanwhile.
      - name: Check browser-side variables are readable
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          ENV_TARGET=$([ "$TARGET" = "production" ] && echo production || echo preview)
          node - "$ENV_TARGET" <<'JS'
          const fs = require("node:fs");
          const target = process.argv[2];
          const CLIENT = /^(VITE_|NEXT_PUBLIC_|PUBLIC_|NUXT_PUBLIC_|EXPO_PUBLIC_)/;
          const bad = new Set();
          (async () => {
            const url = `https://api.vercel.com/v10/projects/${process.env.VERCEL_PROJECT_ID}/env?teamId=${process.env.VERCEL_ORG_ID}`;
            const res = await fetch(url, { headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` } });
            if (!res.ok) throw new Error(`Vercel env list: HTTP ${res.status}`);
            for (const e of (await res.json()).envs ?? [])
              if (CLIENT.test(e.key) && e.type === "sensitive" && (e.target ?? []).includes(target)) bad.add(e.key);
            const file = `.vercel/.env.${target}.local`;
            if (fs.existsSync(file))
              for (const line of fs.readFileSync(file, "utf8").split("\n")) {
                const m = /^([A-Z0-9_]+)=(.*)$/.exec(line.trim());
                if (m && CLIENT.test(m[1]) && m[2].replace(/^"|"$/g, "") === "") bad.add(m[1]);
              }
            // Only variables the app's code reads matter: a blank one nothing uses (e.g. a team-wide
            // shared variable linked to every project) can't break the site. Code reads a variable by
            // naming it (import.meta.env.X, import.meta.env["X"], env["X"]), so a name that appears
            // nowhere in the source is never read. If the code builds names ("VITE_" + x), every
            // variable counts.
            const SKIP = new Set(["node_modules", ".git", ".vercel", ".claude", "dist", "build", ".output", ".next", "android", "ios", "coverage"]);
            const EXT = /\.(c|m)?(j|t)sx?$|\.(vue|svelte|astro|html)$/;
            let src = "";
            (function walk(dir) {
              for (const d of fs.readdirSync(dir, { withFileTypes: true })) {
                if (d.isDirectory()) { if (!SKIP.has(d.name)) walk(`${dir}/${d.name}`); }
                else if (EXT.test(d.name)) src += fs.readFileSync(`${dir}/${d.name}`, "utf8") + "\n";
              }
            })(".");
            const builtNames = /["'`](VITE_|NEXT_PUBLIC_|PUBLIC_|NUXT_PUBLIC_|EXPO_PUBLIC_)["'`]\s*\+|`(VITE_|NEXT_PUBLIC_|PUBLIC_|NUXT_PUBLIC_|EXPO_PUBLIC_)\$\{/.test(src);
            if (!builtNames)
              for (const k of [...bad])
                if (!src.includes(k)) { console.log(`Ignoring ${k}: Sensitive or blank in Vercel, but the code never reads it.`); bad.delete(k); }
            if (bad.size) {
              const list = [...bad].sort().join(", ");
              console.log(`::error::Browser-side variable(s) ${list} are Sensitive (or blank) in Vercel, so this build would ship them empty and the site would break. Re-save them in Vercel as non-sensitive (they are public in the browser anyway), or set this app to build on Vercel. Nothing was deployed.`);
              process.exit(1);
            }
            console.log("Browser-side variables are readable.");
          })().catch((e) => { console.log(`::error::${e.message}`); process.exit(1); });
          JS

      - name: Build (vercel build)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # What Vercel's own build machines set, so apps build exactly as they do there.
          VERCEL: "1"
          CI: "1"
          VERCEL_ENV: ${{ inputs.target == 'production' && 'production' || 'preview' }}
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_COMMIT_REF: ${{ inputs.branch }}
          VERCEL_GIT_COMMIT_SHA: ${{ inputs.sha }}
          # nitro (TanStack Start) takes the first provider it detects, and GITHUB_ACTIONS comes
          # before VERCEL in its list, so on a runner it fell back to its default preset
          # (cloudflare-module in the Lovable config) and vercel build found no output. Name it.
          # Apps without nitro (DareToFish) ignore this.
          NITRO_PRESET: vercel
        run: |
          set -euo pipefail
          # Runs the project's own install + build commands (vercel.json /
          # project settings), exactly as a Vercel build machine would.
          if [ "$TARGET" = "production" ]; then
            npx --yes "$VERCEL_CLI" build --prod --yes
          else
            npx --yes "$VERCEL_CLI" build --yes
          fi
          test -f .vercel/output/config.json
          du -sh .vercel/output

      # Secrets that must never be in files a browser downloads. On 2026-11-14 DareToFish's public
      # code was found to contain its Resend API key (a VITE_ variable, which Vite inlines).
      # Prints the file and kind of secret, never the value.
      - name: Check no secrets in the public site files
        run: |
          set -euo pipefail
          STATIC=".vercel/output/static"
          [ -d "$STATIC" ] || { echo "No static output, nothing to scan"; exit 0; }
          FOUND=0
          check() {
            local kind="$1" re="$2" files
            files="$(grep -rlE -- "$re" "$STATIC" 2>/dev/null | head -5 || true)"
            if [ -n "$files" ]; then echo "::error::$kind found in public files: $(echo $files)"; FOUND=1; fi
          }
          check "Resend API key" 're_[A-Za-z0-9]{8}_[A-Za-z0-9]{16,}'
          check "Stripe secret key" 'sk_(live|test)_[A-Za-z0-9]{16,}'
          check "Paystack secret key" 'sk_(live|test)_[a-f0-9]{30,}'
          check "Supabase secret key" 'sb_secret_[A-Za-z0-9_-]{16,}'
          check "AWS access key" 'AKIA[0-9A-Z]{16}'
          check "Private key" '-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if [ "$FOUND" = "1" ]; then
            echo "::error::Remove the variable from Vercel (or stop the code reading import.meta.env as a whole object), and rotate the exposed key."
            exit 1
          fi
          echo "No known secret patterns in public files"

      - name: Deploy prebuilt output
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          MESSAGE="$(git log -1 --format=%s | cut -c1-250)"
          AUTHOR="$(git log -1 --format=%an)"
          META=(
            --meta "githubCommitRef=${BRANCH}"
            --meta "githubCommitSha=${SHA}"
            --meta "githubCommitMessage=${MESSAGE}"
            --meta "githubCommitAuthorName=${AUTHOR}"
            --meta "homelabBuild=1"
          )
          if [ -n "$BUILD_ID" ]; then META+=(--meta "homelabBuildId=${BUILD_ID}"); fi
          if [ "$TARGET" = "staging" ] && [ -n "$STAGING_ALIAS" ]; then
            META+=(--meta "branchAlias=${STAGING_ALIAS}")
          fi
          # Production is uploaded without moving the domains; it goes live only after the
          # browser check below passes ("Make it live").
          PROD=(); if [ "$TARGET" = "production" ]; then PROD=(--prod --skip-domain); fi
          # The upload sometimes drops mid-way on the home connection ("fetch failed"). Retry:
          # Vercel only asks again for files it has not received, so a retry resumes.
          URL=""
          for attempt in 1 2 3; do
            if URL="$(npx --yes "$VERCEL_CLI" deploy --prebuilt "${PROD[@]}" --yes "${META[@]}")"; then break; fi
            URL=""
            if [ "$attempt" -lt 3 ]; then echo "::warning::Upload attempt $attempt failed, retrying in $((attempt * 15))s"; sleep $((attempt * 15)); fi
          done
          URL="$(printf '%s\n' "$URL" | grep -Eo 'https://[^ ]+' | tail -1)"
          [ -n "$URL" ] || { echo "::error::vercel deploy did not print a deployment URL"; exit 1; }
          ID="$(npx --yes "$VERCEL_CLI" inspect "$URL" 2>&1 | grep -Eo 'dpl_[A-Za-z0-9]+' | head -1 || true)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "Deployed $URL ($ID)"

      # Load the new build in a real browser before (production) or right after (staging) it is used.
      # On 2026-11-14 a build returned 200 for every request while every visitor saw "Something
      # went wrong". A protected deployment URL (Vercel login wall) cannot be checked: warn, go on.
      - name: Check the site renders in a browser
        id: render
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          PW="$RUNNER_TEMP/render-check"
          mkdir -p "$PW"
          npm install --prefix "$PW" --no-save --no-audit --no-fund --silent playwright@1.64.1
          (cd "$PW" && npx --no-install playwright install chromium-headless-shell >/dev/null)
          cat > "$PW/check.cjs" <<'JS'
          const { chromium } = require("playwright");
          const ERR = /Something went wrong|Application error|This page didn't load|Internal Server Error/i;
          (async () => {
            const url = process.argv[2];
            const browser = await chromium.launch({ args: ["--disable-dev-shm-usage"] });
            const ctx = await browser.newContext({ serviceWorkers: "block" });
            const page = await ctx.newPage();
            const errs = [];
            page.on("pageerror", (e) => errs.push(e.message.slice(0, 200)));
            let out = "ok";
            try {
              const res = await page.goto(url, { waitUntil: "load", timeout: 45000 });
              await page.waitForLoadState("networkidle", { timeout: 15000 }).catch(() => {});
              await page.waitForTimeout(2000);
              const host = new URL(page.url()).hostname;
              const text = (await page.locator("body").innerText().catch(() => "")) || "";
              if (host === "vercel.com" || host.endsWith(".vercel.com")) out = "protected";
              else if (!res || res.status() >= 500) out = "fail: HTTP " + (res ? res.status() : "none");
              else if (ERR.test(text)) out = "fail: error screen \"" + text.match(ERR)[0] + "\"" + (errs[0] ? ": " + errs[0] : "");
              else if (text.trim().length < 20) out = "fail: page rendered nothing" + (errs[0] ? ": " + errs[0] : "");
            } catch (e) {
              out = "fail: " + String(e.message).split("\n")[0];
            }
            await browser.close();
            console.log(out);
          })();
          JS
          RESULT=""
          for attempt in 1 2; do
            RESULT="$(node "$PW/check.cjs" "$URL")"
            case "$RESULT" in fail*) [ "$attempt" = 1 ] && sleep 20 ;; *) break ;; esac
          done
          rm -rf "$PW"
          echo "Browser check: $RESULT"
          case "$RESULT" in
            ok) ;;
            protected) echo "::warning::The deployment URL is behind Vercel's login, so the browser check could not run." ;;
            *)
              if [ "$TARGET" = "production" ]; then
                echo "::error::The new build does not render ($RESULT). It was NOT made live; production is unchanged."
              else
                echo "::error::The new staging build does not render ($RESULT)."
              fi
              exit 1 ;;
          esac

      - name: Point the staging alias at this build
        if: ${{ inputs.target == 'staging' && inputs.staging-alias != '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes "$VERCEL_CLI" alias set "$URL" "$STAGING_ALIAS"

      - name: Make it live (production)
        if: ${{ inputs.target == 'production' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes "$VERCEL_CLI" promote "$URL" --yes --timeout=5m
          echo "Production domains now point at $URL"

      - name: Summary
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ID: ${{ steps.deploy.outputs.id }}
        run: |
          {
            echo "### Homelab prebuilt deploy: ${TARGET}"
            echo ""
            echo "- Commit: \`${SHA}\` on \`${BRANCH}\`"
            echo "- Mission Control build id: ${BUILD_ID:-none}"
            echo "- Deployment: ${URL:-not created} ${ID:+(\`$ID\`)}"
            if [ "$TARGET" = "staging" ] && [ -n "$STAGING_ALIAS" ]; then echo "- Staging alias: https://${STAGING_ALIAS}"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove pulled environment variables
        if: always()
        run: rm -rf .vercel/.env.*.local .vercel/output
